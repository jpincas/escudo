<svg xmlns="http://www.w3.org/2000/svg" width="900" height="646" viewBox="0 0 900 646"><rect width="900" height="646" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">Who does what</text><rect x="40" y="110" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="66" y="162" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Coordinator</text><rect x="66" y="178" width="51" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="91.5" y="198.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="66" y="250" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Holds the whole thing.</text><text x="66" y="276" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">The list, the drills, and</text><text x="66" y="302" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">the known face for the Junta</text><text x="66" y="328" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Vecinal and the Ayuntamiento.</text><rect x="470" y="110" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="496" y="162" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Assistants</text><rect x="496" y="178" width="73" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="532.5" y="198.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1–2</text><text x="496" y="250" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">The coordinator’s hands.</text><text x="496" y="276" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Sit next to each neighbour</text><text x="496" y="302" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">and get the phone working</text><text x="496" y="328" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">properly, there and then.</text><rect x="255.0" y="376" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="281.0" y="428" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Technical lead</text><rect x="281.0" y="444" width="51" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="306.5" y="464.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="281.0" y="516" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Runs the bot, the group,</text><text x="281.0" y="542" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">the server and — if it comes</text><text x="281.0" y="568" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">— the radio network.</text><text x="281.0" y="594" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Holds the token.</text></svg>