<svg xmlns="http://www.w3.org/2000/svg" width="900" height="546" viewBox="0 0 900 546"><rect width="900" height="546" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">Telegram onboarding</text><rect x="40" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="154" r="23" fill="#e0a12e"/><text x="78" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="118" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Join the group</text><text x="66" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Red Escudo &lt;Village&gt;.</text><text x="66" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">A neighbour adds them, not you.</text><rect x="470" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="154" r="23" fill="#e0a12e"/><text x="508" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">2</text><text x="548" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Open the button</text><text x="496" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Press START once. Until then</text><text x="496" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">there are no buttons.</text><rect x="40" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="370" r="23" fill="#e0a12e"/><text x="78" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">3</text><text x="118" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Make it audible</text><text x="66" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Group and button, off silent.</text><text x="66" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Proved before they leave.</text><rect x="470" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="370" r="23" fill="#e0a12e"/><text x="508" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">4</text><text x="548" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Look, don't press</text><text x="496" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Every press alarms the whole</text><text x="496" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">village. Drills only.</text></svg>