<svg xmlns="http://www.w3.org/2000/svg" width="900" height="646" viewBox="0 0 900 646"><rect width="900" height="646" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">Quién hace qué</text><rect x="40" y="110" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="66" y="162" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Coordinador/a</text><rect x="66" y="178" width="51" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="91.5" y="198.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="66" y="250" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Responsable del conjunto.</text><text x="66" y="276" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">La lista, los simulacros y</text><text x="66" y="302" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">la cara ante la Junta</text><text x="66" y="328" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Vecinal y el Ayuntamiento.</text><rect x="470" y="110" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="496" y="162" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Apoyos</text><rect x="496" y="178" width="73" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="532.5" y="198.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1–2</text><text x="496" y="250" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Las manos de la coordinación.</text><text x="496" y="276" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Sientan a cada vecino a</text><text x="496" y="302" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">configurar el móvil hasta</text><text x="496" y="328" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">que funcione de verdad.</text><rect x="255.0" y="376" width="390" height="240" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="281.0" y="428" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Responsable técnico</text><rect x="281.0" y="444" width="51" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="306.5" y="464.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="281.0" y="516" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Monta y mantiene el bot,</text><text x="281.0" y="542" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">el grupo, el servidor y,</text><text x="281.0" y="568" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">si llega, la red de radio.</text><text x="281.0" y="594" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Guarda el token.</text></svg>