<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465"><rect width="900" height="465" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">Al acudir</text><rect x="40" y="105" width="120" height="36" rx="18.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="100.0" y="128.5" font-family="Public Sans" font-size="18" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Sí</text><rect x="40" y="175" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="203" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Llamar antes al 062 o al 112</text><rect x="40" y="227" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="255" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Decirlo en el grupo: «voy»</text><rect x="40" y="279" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="307" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Ayudar desde un sitio seguro</text><rect x="40" y="331" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="359" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Describir conductas y vehículos</text><rect x="40" y="383" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="411" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Cancelar si es falsa alarma</text><rect x="470" y="105" width="120" height="36" rx="18.0" fill="#d24435" stroke="none" stroke-width="0"/><text x="530.0" y="128.5" font-family="Public Sans" font-size="18" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Nunca</text><rect x="470" y="175" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="203" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Intervenir, perseguir o retener</text><rect x="470" y="227" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="255" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Entrar donde hay peligro</text><rect x="470" y="279" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="307" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Fotografiar a nadie</text><rect x="470" y="331" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="359" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Mencionar etnia u origen</text><rect x="470" y="383" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="411" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Contarlo fuera del grupo</text></svg>