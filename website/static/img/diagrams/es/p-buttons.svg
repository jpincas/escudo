<svg xmlns="http://www.w3.org/2000/svg" width="900" height="546" viewBox="0 0 900 546"><rect width="900" height="546" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">Alta de teléfonos y aparatos</text><rect x="40" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="154" r="23" fill="#e0a12e"/><text x="78" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="118" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Elegirlo juntos</text><text x="66" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Nunca desde una lista.</text><text x="66" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Una casa, un martes cualquiera.</text><rect x="470" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="154" r="23" fill="#e0a12e"/><text x="508" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">2</text><text x="548" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Llamar al número</text><text x="496" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Llama el propio aparato.</text><text x="496" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">El coordinador le pone nombre.</text><rect x="40" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="370" r="23" fill="#e0a12e"/><text x="78" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">3</text><text x="118" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Dar la dirección</text><text x="66" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Un aparato de pared no tiene GPS.</text><text x="66" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Es adonde acuden los vecinos.</text><rect x="470" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="370" r="23" fill="#e0a12e"/><text x="508" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">4</text><text x="548" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Seguir probándolo</text><text x="496" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">El bot lleva la rota.</text><text x="496" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Sin prueba no hay garantía.</text></svg>