<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f8f6"/><text x="600.0" y="62" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">One button, two forms</text><rect x="60" y="110" width="540" height="460" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="100" y="168" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">The virtual button</text><text x="100" y="198" font-family="Public Sans" font-size="17" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.7">Telegram, on a phone</text><rect x="660" y="110" width="540" height="460" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><text x="700" y="168" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">A physical button</text><text x="700" y="198" font-family="Public Sans" font-size="17" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.7">On the wall, or worn</text><rect x="100" y="230" width="150" height="230" rx="18" fill="#f7f8f6" stroke="#22201c" stroke-width="2.5"/><circle cx="175" cy="300" r="38" fill="#d24435"/><text x="175" y="309" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">SOS</text><rect x="120" y="358" width="110" height="10" rx="5" fill="#22201c" opacity="0.15"/><rect x="120" y="380" width="80" height="10" rx="5" fill="#22201c" opacity="0.15"/><text x="285" y="248" font-family="Public Sans" font-size="17" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.7">Asks what kind:</text><rect x="285" y="270" width="260" height="30" rx="15.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="415.0" y="290.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Fire</text><rect x="285" y="310" width="260" height="30" rx="15.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="415.0" y="330.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Medical</text><rect x="285" y="350" width="260" height="30" rx="15.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="415.0" y="370.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Crime</text><rect x="285" y="390" width="260" height="30" rx="15.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="415.0" y="410.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Emergency</text><text x="285" y="448" font-family="Public Sans" font-size="15" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.7">And one that doesn't:</text><rect x="285" y="462" width="260" height="32" rx="16.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="415.0" y="483.5" font-family="Public Sans" font-size="15" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">Ask for help</text><rect x="700" y="265" width="170" height="170" rx="16" fill="#f7f8f6" stroke="#22201c" stroke-width="2.5"/><circle cx="785" cy="350" r="56" fill="#d24435"/><circle cx="785" cy="350" r="56" fill="none" stroke="#22201c" stroke-width="3" opacity="0.25"/><text x="785" y="361" font-family="Bricolage Grotesque" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">SOS</text><text x="885" y="248" font-family="Public Sans" font-size="17" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.7">No screen, no options:</text><rect x="885" y="270" width="260" height="34" rx="17.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="1015.0" y="292.5" font-family="Public Sans" font-size="16" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">One press</text><rect x="100" y="528" width="240" height="30" rx="15.0" fill="#e0a12e" stroke="none" stroke-width="0"/><text x="220.0" y="548.5" font-family="Public Sans" font-size="14" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">Built and in use</text><rect x="700" y="528" width="240" height="30" rx="15.0" fill="none" stroke="none" stroke-width="0"/><text x="820.0" y="548.5" font-family="Public Sans" font-size="14" font-weight="600" fill="#153f32" text-anchor="middle" opacity="1">Ready, needs a number</text><rect x="700" y="528" width="240" height="30" rx="15" fill="none" stroke="#153f32" stroke-width="2" opacity="0.5"/><path d="M330 600 L330 643" stroke="#153f32" stroke-width="3" stroke-linecap="round"/><path d="M322 641 L330 655 L338 641" fill="#153f32"/><path d="M870 600 L870 643" stroke="#153f32" stroke-width="3" stroke-linecap="round"/><path d="M862 641 L870 655 L878 641" fill="#153f32"/><rect x="60" y="655" width="1080" height="66" rx="14" fill="#153f32" stroke="none" stroke-width="0"/><text x="600.0" y="696" font-family="Bricolage Grotesque" font-size="24" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">The same alert, into the same group, reaching the same people</text></svg>