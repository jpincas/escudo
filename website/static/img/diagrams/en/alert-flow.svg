<svg xmlns="http://www.w3.org/2000/svg" width="900" height="762" viewBox="0 0 900 762"><rect width="900" height="762" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">How an alert flows</text><rect x="40" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#d24435" stroke-width="2.5"/><circle cx="78" cy="154" r="23" fill="#e0a12e"/><text x="78" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">1</text><text x="118" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#d24435" text-anchor="start" opacity="1">Raise it</text><text x="66" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Whoever notices presses.</text><text x="66" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">062 or 112 first if needed.</text><rect x="470" y="110" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="154" r="23" fill="#e0a12e"/><text x="508" y="161.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">2</text><text x="548" y="163" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">It arrives</text><text x="496" y="222" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Every member at once.</text><text x="496" y="250" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">No dispatcher, no queue.</text><rect x="40" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="370" r="23" fill="#e0a12e"/><text x="78" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">3</text><text x="118" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Answer</text><text x="66" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Say “going” in the group.</text><text x="66" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">The step people skip.</text><rect x="470" y="326" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="370" r="23" fill="#e0a12e"/><text x="508" y="377.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">4</text><text x="548" y="379" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Go</text><text x="496" y="438" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Observe, report, help.</text><text x="496" y="466" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Never intervene or pursue.</text><rect x="40" y="542" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="78" cy="586" r="23" fill="#e0a12e"/><text x="78" y="593.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">5</text><text x="118" y="595" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Stand down</text><text x="66" y="654" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">One button cancels it.</text><text x="66" y="682" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">Nobody is questioned.</text><rect x="470" y="542" width="390" height="190" rx="14" fill="#ffffff" stroke="#153f32" stroke-width="2.5"/><circle cx="508" cy="586" r="23" fill="#e0a12e"/><text x="508" y="593.5" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">6</text><text x="548" y="595" font-family="Bricolage Grotesque" font-size="27" font-weight="700" fill="#153f32" text-anchor="start" opacity="1">Close it off</text><text x="496" y="654" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">One line in the group.</text><text x="496" y="682" font-family="Public Sans" font-size="19" font-weight="400" fill="#22201c" text-anchor="start" opacity="0.78">What it was, who went.</text></svg>