<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465"><rect width="900" height="465" fill="#f7f8f6"/><text x="450.0" y="62" font-family="Bricolage Grotesque" font-size="42" font-weight="700" fill="#153f32" text-anchor="middle" opacity="1">When you go</text><rect x="40" y="105" width="120" height="36" rx="18.0" fill="#153f32" stroke="none" stroke-width="0"/><text x="100.0" y="128.5" font-family="Public Sans" font-size="18" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Do</text><rect x="40" y="175" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="203" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Call 062 or 112 first</text><rect x="40" y="227" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="255" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Say “going” in the group</text><rect x="40" y="279" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="307" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Help from somewhere safe</text><rect x="40" y="331" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="359" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Describe behaviour and vehicles</text><rect x="40" y="383" width="390" height="42" rx="8" fill="#ffffff" stroke="#153f32" stroke-width="2"/><text x="58" y="411" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Press False alarm if it's nothing</text><rect x="470" y="105" width="120" height="36" rx="18.0" fill="#d24435" stroke="none" stroke-width="0"/><text x="530.0" y="128.5" font-family="Public Sans" font-size="18" font-weight="600" fill="#f7f8f6" text-anchor="middle" opacity="1">Never</text><rect x="470" y="175" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="203" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Intervene, pursue or detain</text><rect x="470" y="227" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="255" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Go in where it isn't safe</text><rect x="470" y="279" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="307" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Photograph anyone</text><rect x="470" y="331" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="359" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Mention ethnicity or origin</text><rect x="470" y="383" width="390" height="42" rx="8" fill="#ffffff" stroke="#d24435" stroke-width="2"/><text x="488" y="411" font-family="Public Sans" font-size="18" font-weight="400" fill="#22201c" text-anchor="start" opacity="1">Repeat it outside the group</text></svg>